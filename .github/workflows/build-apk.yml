name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md' ]
  pull_request:
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg=$(grep -E "^e: |What went wrong|error:" -A2 build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors::${msg}"
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Numbloo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Numbloo-apk
          path: Numbloo.apk
